[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "e-language-bench"
version = "1.0.0"
description = "A compiler-backed Easy Language benchmark for coding models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
e-language-bench = "elang_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

